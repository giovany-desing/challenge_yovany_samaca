name: Continuous Delivery

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Trigger Render Deploy
      run: |
        curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"